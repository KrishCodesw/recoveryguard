name: Observer integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observer-integration:
    name: Java 17 observer against three-broker Lab
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out product
        uses: actions/checkout@v4

      - name: Check out pinned Lab infrastructure
        uses: actions/checkout@v4
        with:
          repository: KrishCodesw/recoveryguard-lab
          ref: 16d61c8f4825340145d524f26969353e0dd1422f
          path: .ci/recoveryguard-lab
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Start the Lab Kafka cluster
        working-directory: .ci/recoveryguard-lab
        run: docker compose up -d --wait --wait-timeout 240

      - name: Run product tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Run observer against the Lab cluster
        run: bash scripts/verify-lab-observer.sh

      - name: Show Lab logs on failure
        if: failure()
        working-directory: .ci/recoveryguard-lab
        run: docker compose logs --no-color

      - name: Stop Lab cluster
        if: always()
        working-directory: .ci/recoveryguard-lab
        run: docker compose down --volumes --remove-orphans
